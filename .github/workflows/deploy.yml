name: build & deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'AGENTS.md'
      - 'CHANGELOG.md'
      - 'TODO.md'
      - '.gitignore'
      - 'docs/proxy.yaml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 仓库公开 → 镜像公开 → 服务器可匿名 pull,无需在服务器存任何凭据
      - name: Compute image owner (lowercase)
        id: img
        run: |
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/zx-home" >> "$GITHUB_OUTPUT"

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ steps.img.outputs.image }}:${{ github.sha }}
            ${{ steps.img.outputs.image }}:latest

      # 从 Actions 发布到公开仓库的包会继承仓库可见性 → 默认即 public。
      # 这里读回实际可见性并断言;若为 private(如从私有仓库/手动推包),
      # 用 zxLumen PAT(write:packages)兜底置公开,GITHUB_TOKEN 再作后备。
      - name: Ensure GHCR package is public
        env:
          GH_PACKAGES_PAT: ${{ secrets.GH_PACKAGES_PAT }}
        run: |
          NAME="zx-home"
          VIS=""
          for TOKEN in "${{ secrets.GITHUB_TOKEN }}" "$GH_PACKAGES_PAT"; do
            [ -n "$TOKEN" ] || continue
            VIS=$(gh api -H "Authorization: token ${TOKEN}" "/user/packages/container/${NAME}" --jq .visibility 2>/dev/null || echo "")
            if [ "${VIS}" = "public" ]; then
              echo "GHCR 包 ${NAME} 已是 public(可见性继承自公开仓库)"
              exit 0
            fi
            gh api -H "Authorization: token ${TOKEN}" -X PATCH "/user/packages/container/${NAME}" \
                -F visibility=public >/dev/null 2>&1 || true
            VIS=$(gh api -H "Authorization: token ${TOKEN}" "/user/packages/container/${NAME}" --jq .visibility 2>/dev/null || echo "")
            echo "尝试以 token(*-masked) 设为 public 后 → ${VIS}"
            [ "${VIS}" = "public" ] && exit 0
          done
          echo "::error::GHCR 包 ${NAME} 仍为 ${VIS}(应 public,服务器才能匿名 pull)"
          exit 1

      - name: SSH deploy to server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_DEPLOY_KEY }}
          port: ${{ secrets.SERVER_PORT || '22' }}
          # 只发部署 tag;服务器 authorized_keys 的 command= 白名单会把它作为
          # IMAGE_TAG 传给 deploy.sh(即使密钥泄露也跑不了别的命令)
          script: ${{ github.sha }}