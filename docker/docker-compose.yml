services:
  app:
    # 本地/CI 构建产物推 GHCR(ghcr.io/zxlumen/zx-home:<tag>),服务器只 pull 不构建。
    # 本地开发仍可用 `docker compose build` 覆盖构建(zx-home:latest)。
    image: ghcr.io/zxlumen/zx-home:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PATH: /data/zx.db
      NODE_ENV: production
      # 运行时站点内容(hot reload:mtime 变更即生效,无需重启/重建)
      CONTENT_FILE: /srv/site/content.json
    volumes:
      - zx-data:/data
      # 站点内容 + 简历 PDF / 二维码(不入镜像,由 Caddy 静态服务)
      - ./site-content:/srv/site:ro
    expose:
      - "3000"
    networks:
      - web

  # 其他项目 demo:加到同一网络,在 Caddyfile 里按子域名反代
  # demo1:
  #   image: your-demo-image:latest
  #   restart: unless-stopped
  #   expose:
  #     - "8080"
  #   networks:
  #     - web

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
      # 静态资源(简历 PDF / 微信二维码)挂在 Caddy,不走应用
      - ./site-content:/srv/site:ro
    networks:
      - web

volumes:
  zx-data:
  caddy-data:
  caddy-config:

networks:
  web:
    driver: bridge
