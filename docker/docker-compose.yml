services:
  app:
    # 本地/CI 构建产物推 GHCR(ghcr.io/zxlumen/zx-home:<tag>),服务器只 pull 不构建。
    # 本地开发仍可用 `docker compose build` 覆盖构建(zx-home:latest)。
    image: ghcr.io/zxlumen/zx-home:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PATH: /data/zx.db
      NODE_ENV: production
      # 运行时站点内容(hot reload:mtime 变更即生效,无需重启/重建)
      CONTENT_FILE: /srv/site/content.json
      # 机器人目录(corpus/persona/faq/knowledge);不设则应用找不到、蒸馏失效
      CHATBOT_DIR: /srv/site/chatbot
      # SSO:让 zx_admin 会话 cookie 覆盖所有子域(如 yijing.${DOMAIN})。不设则 cookie
      # host-only,嵌在应用栏里的易经 / Opentodo 收不到登录态、无法判定站长。
      ADMIN_COOKIE_DOMAIN: ${ADMIN_COOKIE_DOMAIN:-.${DOMAIN}}
    volumes:
      - zx-data:/data
      # 站点内容 + 简历 PDF / 二维码(不入镜像,由 Caddy 静态服务)
      - ./site-content:/srv/site:ro
      # 机器人目录需可写(蒸馏生成 persona.md/faq.json);更具体的挂载覆盖上面的 :ro
      # 注意:宿主机该目录须对容器内用户(uid 10001)可写,见 docs/CHATBOT.md「部署」
      - ./site-content/chatbot:/srv/site/chatbot
      # 视频封面目录需可写(/admin 面板上传封面,存 <vid>.user.jpg);同样覆盖上面的 :ro
      # 注意:宿主机该目录须对容器内用户(uid 10001)可写,见 AGENTS.md「部署」
      - ./site-content/vlog:/srv/site/vlog
      # 应用栏图标目录需可写(/admin「应用」面板上传图标,存 <id>.png);同样覆盖上面的 :ro
      # 注意:宿主机该目录须对容器内用户(uid 10001)可写,见 AGENTS.md「部署」
      - ./site-content/apps:/srv/site/apps
    expose:
      - "3000"
    networks:
      - web

  # 其他项目 demo:加到同一网络,在 Caddyfile 里按子域名反代
  # demo1:
  #   image: your-demo-image:latest
  #   restart: unless-stopped
  #   expose:
  #     - "8080"
  #   networks:
  #     - web

  # Opentodo 网页版(独立服务,ghcr 镜像,服务器只 pull)。
  # 给主站 iframe 嵌进应用栏;与博客共享 admin(SSO)—— 两边配同一个 SESSION_SECRET
  # (在 docker/.env 里)。Caddy 里一对一 todo.${DOMAIN}。详见 Opentodo 仓库 web/README.md。
  opentodo:
    image: ghcr.io/zxlumen/opentodo-web:${OPENTODO_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      # 站长数据(单 JSON);访客数据落在同卷的 visitors/
      OPENTODO_FILE: /data/todos.json
      # 运行期数据目录(访客 / 对话 / 配置)也指到卷上 —— 否则落在容器可写层,重建即丢
      OPENTODO_DATA_DIR: /data
      # 放行访客使用 AI(走站长配的 provider);=0 关闭
      OPENTODO_VISITOR_AI: ${OPENTODO_VISITOR_AI:-1}
      # 大模型经博客 AI 网关(令牌在博客 admin「AI 密钥」页生成后填 docker/.env)
      ZX_AI_GATEWAY_URL: http://app:3000/api/ai/v1
      ZX_AI_APP_TOKEN: ${OPENTODO_AI_TOKEN:-}
    volumes:
      - opentodo-data:/data
    expose:
      - "8787"
    networks:
      - web

  # 易经六十四卦网页版(独立服务,ghcr 镜像,服务器只 pull)。
  # 与 Opentodo 同一套模式:给主站 iframe 嵌进应用栏;与博客共享 admin(SSO)——
  # 两边配同一个 SESSION_SECRET(在 docker/.env 里)。详见 yijing64 仓库 web/README.md。
  yijing:
    image: ghcr.io/zxlumen/yijing64-web:${YIJING_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      YIJING_PORT: 8788
      # 运行期数据目录(记录 / AI 配置 / Key / owner token)指到卷上
      # —— 否则落在容器可写层,重建即丢
      YIJING_DATA_DIR: /data
      # 放行访客使用 AI(走站长配的 provider);=0 关闭
      YIJING_VISITOR_AI: ${YIJING_VISITOR_AI:-1}
      # 大模型经博客 AI 网关(令牌在博客 admin「AI 密钥」页生成后填 docker/.env)
      ZX_AI_GATEWAY_URL: http://app:3000/api/ai/v1
      ZX_AI_APP_TOKEN: ${YIJING_AI_TOKEN:-}
      # SESSION_SECRET 由上面的 env_file 带入(与博客同一个):已登录博客即视为站长
    volumes:
      - yijing-data:/data
    expose:
      - "8788"
    networks:
      - web

  # StockApp 股票速览(独立服务,ghcr 镜像,服务器只 pull)。
  # 与 Opentodo / 易经同一套模式:给主站 iframe 嵌进应用栏;与博客共享 admin(SSO)——
  # 两边配同一个 SESSION_SECRET(在 docker/.env 里)。详见 StockApp 仓库 README.md。
  stock:
    image: ghcr.io/zxlumen/stock-web:${STOCK_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      STOCK_HOST: 0.0.0.0
      STOCK_PORT: 8789
      # 运行期数据目录(自选股 / AI 配置 / Key / owner token)指到卷上
      # —— 否则落在容器可写层,重建即丢
      STOCK_DATA_DIR: /data
      # 放行访客使用 AI 解读(走站长配的 provider);=0 关闭
      STOCK_VISITOR_AI: ${STOCK_VISITOR_AI:-1}
      # 大模型经博客 AI 网关(令牌在博客 admin「AI 密钥」页生成后填 docker/.env)
      ZX_AI_GATEWAY_URL: http://app:3000/api/ai/v1
      ZX_AI_APP_TOKEN: ${STOCK_AI_TOKEN:-}
      # SESSION_SECRET 由上面的 env_file 带入(与博客同一个):已登录博客即视为站长
    volumes:
      - stock-data:/data
    expose:
      - "8789"
    networks:
      - web

  # Luminari 生灵(独立服务,ghcr 镜像,服务器只 pull)。
  # 与 Opentodo / 易经 / StockApp 同一套模式:给主站 iframe 嵌进应用栏;与博客共享站长登录(SSO)——
  # SESSION_SECRET 由上面的 env_file 带入。详见 luminari 仓库 README。
  luminari:
    image: ghcr.io/zxlumen/luminari-web:${LUMINARI_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      LUMINARI_HOST: 0.0.0.0
      LUMINARI_PORT: 8790
      # 运行期数据目录(生灵 / 榜单缓存 / AI 配置 / Key)指到卷上
      LUMINARI_DATA_DIR: /data
      # 放行访客使用 AI(走站长配的 provider);=0 关闭
      LUMINARI_VISITOR_AI: ${LUMINARI_VISITOR_AI:-1}
      # 大模型经博客 AI 网关(令牌在博客 admin「AI 密钥」页生成后填 docker/.env)
      ZX_AI_GATEWAY_URL: http://app:3000/api/ai/v1
      ZX_AI_APP_TOKEN: ${LUMINARI_AI_TOKEN:-}
      # SESSION_SECRET 由上面的 env_file 带入(与博客同一个):已登录博客即视为站长
    volumes:
      - luminari-data:/data
    expose:
      - "8790"
    networks:
      - web

  # 无恙(独立服务:从对话音频觉察身心状态;同套模式:iframe 嵌应用栏 + 站长 SSO)。
  # 大模型与语音转写都经博客 AI 网关(令牌在 admin「AI 密钥」页生成,音频密钥需 Deepgram/AssemblyAI 才可分离)。
  attune:
    image: ghcr.io/zxlumen/attune-web:${ATTUNE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 8792
      ATTUNE_DATA_DIR: /data
      ZX_AI_GATEWAY_URL: http://app:3000/api/ai/v1
      ZX_AI_APP_TOKEN: ${ATTUNE_AI_TOKEN:-}
    volumes:
      - attune-data:/data
    expose:
      - "8792"
    networks:
      - web

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      # 443/udp (HTTP/3) 已关闭:让给同机 Hysteria2 使用 UDP 443;见 Caddyfile 全局 protocols
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    # 用 env_file 传 GRAFANA_BASIC_HASH(bcrypt 含 `$`,不能被 compose 插值)
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
      # 静态资源(简历 PDF / 微信二维码)挂在 Caddy,不走应用
      - ./site-content:/srv/site:ro
    networks:
      - web

  # ==========================================================================
  # 监控(可选,默认不启动):本地采集 → Grafana Cloud(远端)
  #   启动:`docker compose --profile monitoring up -d`
  #   停止:`docker compose --profile monitoring down`
  # 仅容器内网互通,不发布端口到公网。
  # ==========================================================================

  node-exporter:
    image: prom/node-exporter:v1.8.2
    profiles: ["monitoring"]
    restart: unless-stopped
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+)($|/)
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    expose:
      - "9100"
    networks:
      - web

  cadvisor:
    # v0.54+ 支持 Docker 29 的 containerd-snapshotter(否则容器指标为空);新镜像发布在 ghcr.io
    image: ghcr.io/google/cadvisor:v0.60.6
    profiles: ["monitoring"]
    restart: unless-stopped
    privileged: true
    command:
      - --docker_only=true
      - --housekeeping_interval=30s
      - --max_housekeeping_interval=60s
      - --store_container_labels=true
      # 保留 disk/diskIO(容器磁盘 IO);其余高开销/高基数指标仍关闭
      - --disable_metrics=advtcp,cpu_topology,cpuset,hugetlb,memory_numa,process,referenced_memory,resctrl,sched,tcp,udp,percpu
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg
    expose:
      - "8080"
    networks:
      - web

  alloy:
    image: grafana/alloy:v1.5.1
    profiles: ["monitoring"]
    restart: unless-stopped
    depends_on:
      - app
      - node-exporter
      - cadvisor
    env_file: .env
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
    volumes:
      - ./observability/alloy.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - alloy-data:/var/lib/alloy/data
    expose:
      - "12345"
    networks:
      - web

  # 本地 Grafana(Web 查看,数据源指向 Grafana Cloud 的查询接口;不存数据)
  grafana:
    image: grafana/grafana-oss:11.2.2
    profiles: ["monitoring"]
    restart: unless-stopped
    env_file: .env
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_SERVER_ROOT_URL: https://grafana.${DOMAIN}
      GRAFANA_READ_TOKEN: ${GRAFANA_READ_TOKEN}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    expose:
      - "3000"
    networks:
      - web

  # 心语(对话式 MBTI 测评;独立镜像 + 子域 + iframe 嵌应用栏 + 站长 SSO)
  mbti:
    image: ghcr.io/zxlumen/mbti-web:${MBTI_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 8787
      # 大模型经博客 AI 网关(令牌在 admin「AI 密钥」页生成后填 docker/.env)
      ZX_AI_GATEWAY_URL: http://app:3000/api/ai/v1
      ZX_AI_APP_TOKEN: ${MBTI_AI_TOKEN:-}
      # SESSION_SECRET 由 env_file 带入(与博客同一个):已登录博客即视为站长
    volumes:
      - mbti-data:/app/data
      - ./site-content/mascots:/app/mascots
    expose:
      - "8787"
    networks:
      - web

volumes:
  zx-data:
  caddy-data:
  caddy-config:
  alloy-data:
  grafana-data:
  opentodo-data:
  yijing-data:
  stock-data:
  luminari-data:
  attune-data:
  mbti-data:

networks:
  web:
    driver: bridge
