name: build & deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'AGENTS.md'
      - 'CHANGELOG.md'
      - 'TODO.md'
      - '.gitignore'
      - 'docs/proxy.yaml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # 部署前门禁:复用 test.yml(全部测试通过才继续)。
  test:
    uses: ./.github/workflows/test.yml

  build-deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 仓库公开 → 镜像公开 → 服务器可匿名 pull,无需在服务器存任何凭据
      - name: Compute image owner (lowercase)
        id: img
        run: |
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/zx-home" >> "$GITHUB_OUTPUT"
          # 访客沙盒镜像(独立 GHCR 包,docker/opencode-play/)
          echo "play=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/opencode-play" >> "$GITHUB_OUTPUT"

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Sentry:DSN / org / project 均为公开值;AUTH_TOKEN 缺省为空 → 跳过 source map 上传
          build-args: |
            NEXT_PUBLIC_SENTRY_DSN=https://bdb2a7b80ed3fa2b9193741d7859148c@o4512140987203584.ingest.de.sentry.io/4512140996378714
            NEXT_PUBLIC_SENTRY_RELEASE=${{ github.sha }}
            SENTRY_ORG=28a6cde5af7c
            SENTRY_PROJECT=javascript-nextjs
            SENTRY_RELEASE=${{ github.sha }}
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
          tags: |
            ${{ steps.img.outputs.image }}:${{ github.sha }}
            ${{ steps.img.outputs.image }}:latest

      # 访客沙盒镜像(docker/opencode-play/):独立 GHCR 包,服务器按
      # OPENCODE_PLAY_TAG pull(见 docker/deploy.sh)。配置烤进镜像(docker/opencode-play/opencode.json)。
      - name: Build & push opencode-play image
        uses: docker/build-push-action@v6
        with:
          context: docker/opencode-play
          file: docker/opencode-play/Dockerfile
          push: true
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ steps.img.outputs.play }}:${{ github.sha }}
            ${{ steps.img.outputs.play }}:latest

      # 从 Actions 发布到公开仓库的包会继承仓库可见性 → 默认即 public。
      # /user/packages 只对包所有者解析,故用 zxLumen PAT 读回断言;
      # 若为 private 则用同一 PAT 兜底置公开(GH_TOKEN 环境变量方式避免与
      # runner 自带的 GITHUB_TOKEN 冲突)。
      - name: Ensure GHCR packages are public
        env:
          GH_PACKAGES_PAT: ${{ secrets.GH_PACKAGES_PAT }}
        run: |
          [ -n "$GH_PACKAGES_PAT" ] || { echo "::error::缺少 GH_PACKAGES_PAT(zxLumen 的 write:packages PAT)"; exit 1; }
          for NAME in "zx-home" "opencode-play"; do
            vis() { GH_TOKEN="$GH_PACKAGES_PAT" gh api "/user/packages/container/${NAME}" --jq .visibility 2>/dev/null || echo ""; }
            VIS=$(vis "$GH_PACKAGES_PAT")
            echo "读回(zxLumen PAT) ${NAME}: ${VIS}"
            if [ "${VIS}" != "public" ]; then
              GH_TOKEN="$GH_PACKAGES_PAT" gh api -X PATCH "/user/packages/container/${NAME}" \
                  -F visibility=public >/dev/null 2>&1 || true
              VIS=$(vis "$GH_PACKAGES_PAT")
              echo "PAT 置公开后 ${NAME}: ${VIS}"
            fi
            [ "${VIS}" = "public" ] || { echo "::error::GHCR 包 ${NAME} 未确认 public(当前 ${VIS:-未知})"; exit 1; }
          done
          echo "GHCR 包 zx-home / opencode-play 均已是 public"

      # 服务器侧配置(Caddyfile / compose / deploy.sh)不进镜像;服务器 repo 从不
      # `git pull`。改由服务器上的 ci-run.sh 在部署前从公开仓库 fetched 这三个文件
      # (见 docker/ci-run.sh),因此这里无需 scp —— 部署密钥被 authorized_keys 的
      # command= 强制绑定到 ci-run.sh,scp 通道会被拦截。
      - name: SSH deploy to server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_DEPLOY_KEY }}
          port: ${{ secrets.SERVER_PORT || '22' }}
          # 只发部署 tag;服务器 authorized_keys 的 command= 白名单会把它作为
          # IMAGE_TAG 传给 deploy.sh(即使密钥泄露也跑不了别的命令)
          script: ${{ github.sha }}